name: Docker

on:
  pull_request:
    paths-ignore: ['**.md', 'doc/**']
  push:
    branches: [master]
    paths-ignore: ['**.md', 'doc/**']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: latest
      # Fork (Zebrunner): devicefarmer/stf is the image of upstream; the fork builds it on the pull requests only and
      # publishes its own image by the Publish job of ci.yml
      push: ${{ github.event_name == 'push' && github.repository == 'DeviceFarmer/stf' }}
      # Fork (Zebrunner): the Compose job of ci.yml builds and tests the amd64 image of every pull request
      arches: ${{ github.repository == 'DeviceFarmer/stf' && '["amd64", "arm64"]' || '["arm64"]' }}

  # Fork (Zebrunner): zebrunner-docker-debian.yml builds it in the fork, when its files change
  debian:
    name: Debian image
    if: github.event_name == 'pull_request' && github.repository == 'DeviceFarmer/stf'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-debian-x86_64
          platforms: linux/amd64
