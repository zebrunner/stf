version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
# Fork (Zebrunner): the digest of the base image of Dockerfile
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: semver
    versions:
    - 7.3.4
  - dependency-name: style-loader
    versions:
    - 1.2.1
  - dependency-name: express-validator
    versions:
    - 6.9.2
  # Fork (Zebrunner): the types of the Node.js of .nvmrc and of the image (22)
  - dependency-name: "@types/node"
    update-types:
    - version-update:semver-major
  # Fork (Zebrunner): one pull request a week for the minor and patch updates, one for each major
  # update; the @mantine packages take a major update together
  groups:
    mantine:
      patterns:
      - "@mantine/*"
      update-types:
      - major
    npm-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
